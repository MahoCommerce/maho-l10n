{{template config_path="design/email/header"}}
{{inlinecss file="email-inline.css"}}

<table cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td>
            <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td class="action-content">
                        <h1>Hola, echa un vistazo a mi lista de deseos de {{var store.getFrontendName()}}.</h1>
                        <table cellspacing="0" cellpadding="0" class="message-container">
                            <tr>
                                <td>{{var message}}</td>
                            </tr>
                        </table>
                        {{var items}}
                        <p><strong><a href="{{var viewOnSiteLink}}">Ver todos los artículos de lista de deseos</a></strong></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
